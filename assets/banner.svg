<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="orb-glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-glow-2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Pulse Animations -->
    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 8;
        animation: dash 25s linear infinite;
      }
      .node-pulse {
        animation: nodeFlash 3s ease-in-out infinite alternate;
      }
      .badge-float-1 {
        animation: float1 5s ease-in-out infinite alternate;
      }
      .badge-float-2 {
        animation: float2 6s ease-in-out infinite alternate;
      }
      .badge-float-3 {
        animation: float3 5.5s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(7px); }
      }
      @keyframes float3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes pulse {
        0% { opacity: 0.25; transform: scale(0.98); }
        100% { opacity: 0.55; transform: scale(1.02); }
      }
      @keyframes nodeFlash {
        0% { r: 5; opacity: 0.6; }
        100% { r: 8; opacity: 1; }
      }
      .text-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      .text-tagline {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="140" r="280" fill="url(#orb-glow-1)" class="pulse-circle" />
  <circle cx="950" cy="280" r="320" fill="url(#orb-glow-2)" class="pulse-circle" />

  <!-- Tech Grid Background -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Network / Cloud Execution Grid Background Graphics -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <!-- Connecting flow routes -->
    <path d="M 120 340 C 260 300, 340 380, 520 330 S 780 270, 920 320 S 1080 360, 1140 300" class="wave-line" stroke-opacity="0.6" stroke-width="2" />
    <path d="M 80 100 C 240 180, 420 80, 600 130 S 840 70, 1060 110" class="wave-line" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M 980 40 L 1120 180 L 1050 340" stroke="#818cf8" stroke-dasharray="4 6" stroke-opacity="0.5" />
    
    <!-- Floating Tech Nodes -->
    <circle cx="120" cy="340" r="6" fill="#38bdf8" class="node-pulse" />
    <circle cx="520" cy="330" r="5" fill="#818cf8" />
    <circle cx="920" cy="320" r="7" fill="#c084fc" class="node-pulse" />
    <circle cx="1060" cy="110" r="5" fill="#38bdf8" />
    <circle cx="1120" cy="180" r="6" fill="#34d399" />
  </g>

  <!-- Dynamic Feature Badges / Floating Pills (Behind main foreground text, distinct positions) -->
  <g class="badge-float-1" transform="translate(80, 50)">
    <rect width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="36" y="22" fill="#e2e8f0" class="pill-text">⚡ Cross-Browser Grid</text>
  </g>

  <g class="badge-float-2" transform="translate(930, 48)">
    <rect width="195" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#c084fc" />
    <text x="36" y="22" fill="#e2e8f0" class="pill-text">🤖 AI Quality Engineering</text>
  </g>

  <g class="badge-float-3" transform="translate(960, 345)">
    <rect width="165" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#34d399" />
    <text x="34" y="22" fill="#e2e8f0" class="pill-text">📱 Real Device Cloud</text>
  </g>

  <g class="badge-float-1" transform="translate(70, 345)">
    <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#fbbf24" />
    <text x="34" y="22" fill="#e2e8f0" class="pill-text">💎 100% Open Source</text>
  </g>

  <!-- Foreground Content Block (High contrast, never obscured) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 105)" text-anchor="middle">
    <rect x="-140" y="-16" width="280" height="30" rx="15" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.8" />
    <text y="4" fill="#a5b4fc" class="text-tagline">✨ Curated Platform Ecosystem ✨</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 175)" text-anchor="middle">
    <!-- Drop shadow text -->
    <text y="0" fill="#000000" opacity="0.6" class="text-title" filter="url(#glow)">Cloud Software Testing &amp; SaaS</text>
    <text y="0" fill="url(#primary-grad)" class="text-title">Cloud Software Testing &amp; SaaS</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 222)" text-anchor="middle">
    <text fill="#94a3b8" class="text-subtitle">Cross-Browser Grids • Real Device Clouds • AI Quality Automation</text>
  </g>

  <!-- Bottom Capability Badges Flow -->
  <g transform="translate(600, 280)" text-anchor="middle">
    <!-- Playwright -->
    <g transform="translate(-250, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text y="5" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🎭 Playwright</text>
    </g>
    <!-- Selenium -->
    <g transform="translate(-125, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text y="5" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🌐 Selenium</text>
    </g>
    <!-- Cypress -->
    <g transform="translate(0, 0)">
      <rect x="-50" y="-14" width="100" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text y="5" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🌲 Cypress</text>
    </g>
    <!-- Appium -->
    <g transform="translate(125, 0)">
      <rect x="-50" y="-14" width="100" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text y="5" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📱 Appium</text>
    </g>
    <!-- K6 & Locust -->
    <g transform="translate(250, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text y="5" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🚀 k6 &amp; Locust</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-grad)" />
</svg>
